name: Create Issue on Workflow Failure

on:
  workflow_run:
    workflows:
      - CI Health Check
      - Website Smoke Test
      - CodeQL Security Scan
    types:
      - completed

permissions:
  issues: write
  actions: read
  contents: read

jobs:
  create-issue:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const workflow = context.payload.workflow_run;
            const title = `🚨 Workflow failed: ${workflow.name}`;

            const body = `
            A GitHub Actions workflow failed.

            **Workflow:** ${workflow.name}
            **Branch:** ${workflow.head_branch}
            **Commit:** ${workflow.head_sha}
            **Status:** ${workflow.conclusion}
            **Run URL:** ${workflow.html_url}

            Please check:
            - Build errors
            - Supabase environment variables
            - Admin login test
            - Menu page loading
            - Checkout/payment connector issues
            - Storage/image upload issues
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["bug", "automation", "website-check"]
            });
