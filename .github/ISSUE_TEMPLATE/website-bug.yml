name: Website Bug
description: Report a customer website, menu, checkout, or image problem.
title: "[Website]: "
labels: ["website", "bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Website area
      options:
        - Homepage
        - Menu
        - Cart
        - Checkout
        - Admin Dashboard
        - Image Upload
        - Orders
        - Payment Connectors
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
